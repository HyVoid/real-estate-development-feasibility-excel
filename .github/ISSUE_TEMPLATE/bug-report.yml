name: "🐞 Report a Formula or Web App Bug"
description: "Report a reproducible calculation error, broken link, or display issue in the web app or Excel workbook."
title: "[Bug] "
labels: ["bug"]
body:
  - type: dropdown
    id: platform
    attributes:
      label: "Where did the issue happen?"
      options:
        - "Free Browser Web App (GitHub Pages)"
        - "Excel Workbook (.xlsx) — Microsoft 365 / Excel 2021+"
        - "Excel Workbook (.xlsx) — Older Excel Version"
        - "Google Sheets Preview"
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: "What went wrong?"
      description: "Describe the expected result vs. what actually happened."
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: "Steps to reproduce (using fake/example numbers)"
      placeholder: |
        1. Open tab `03_Townhouse_Deal`
        2. Enter Site Area = 800, Units = 4...
        3. Cell C72 shows...
    validations:
      required: true

  - type: checkboxes
    id: privacy_check
    attributes:
      label: "Privacy & Safety Confirmation (Required)"
      options:
        - label: "I have removed all real addresses, personal info, and confidential deal data (synthetic examples only)."
          required: true
